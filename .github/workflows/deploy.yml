name: build-and-deploy

# GitOps: deploying is the only thing that happens on main. Every change lands
# through a PR (see CONTRIBUTING.md); merging to main is what ships it.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC -> AWS, no long-lived keys
  contents: read

# One deploy at a time; never cancel a rolling instance refresh midway.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  ECR_REPO: agroconnect-dev-backend
  ASG_NAME: agroconnect-dev-asg

jobs:
  deploy:
    # Guard: only main deploys. Even a manual dispatch from another branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Roll ASG and wait for the refresh to finish
        run: |
          set -euo pipefail
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}' \
            --query 'InstanceRefreshId' --output text)
          echo "Started instance refresh: $REFRESH_ID"

          for _ in $(seq 1 120); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "refresh status: $STATUS"
            case "$STATUS" in
              Successful) echo "Deploy complete."; exit 0 ;;
              Failed|Cancelled|RollbackFailed|RollbackInProgress)
                echo "Deploy failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for instance refresh."; exit 1
