name: ci

# Gate every PR into main. Deploy happens only after merge (see deploy.yml).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: frontend typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/agroconnect-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/agroconnect-pwa/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Also covers the mock server's contract tests (mock-server/*.test.mjs).
      - run: npm test
      # Includes the type check (tsc --noEmit).
      - run: npm run build

  backend:
    name: backend smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Smoke test (start and probe /health)
        working-directory: backend
        env:
          PORT: "8000"
        run: |
          set -euo pipefail
          node dist/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              exit 0
            fi
            sleep 0.5
          done
          echo "server did not become healthy" >&2
          exit 1

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: Validate
        working-directory: infra
        run: terraform validate
